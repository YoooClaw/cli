name: CI

on:
  pull_request:
    branches: [master, 'release/**']
  push:
    branches: [master, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Verify OSS publication uploader
        run: |
          go -C tools/oss-upload test -race ./...
          go -C tools/oss-upload vet ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Coverage gate
        run: MIN_COVERAGE=55 scripts/coverage-gate.sh

      - name: Build npm distribution (current platform)
        run: scripts/build-go.sh --current

      # release/** 推送由 deploy-test 发「测试环境已发布」通知，这里只覆盖 master 归档。
      - name: Notify Feishu (build complete)
        if: success() && github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/release/')
        env:
          HOOK: ${{ secrets.FEISHU_WEBHOOK_2 }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::FEISHU_WEBHOOK_2 未配置，跳过构建通知"
            exit 0
          fi

          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHORT_SHA="$(git rev-parse --short=12 "$GITHUB_SHA")"
          TEXT="✅ @yoooclaw/cli 构建完成

          🌿 分支：${GITHUB_REF_NAME}
          🔖 Commit：${SHORT_SHA}
          🔎 ${RUN_URL}"
          PAYLOAD=$(jq -nc --arg t "$TEXT" '{msg_type:"text", content:{text:$t}}')

          if ! resp=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$HOOK"); then
            echo "::warning::Feishu webhook 推送失败（curl 请求错误）"
            exit 0
          fi
          code=$(printf '%s' "$resp" | jq -r '.code // .StatusCode // empty')
          if [ "$code" != "0" ]; then
            echo "::warning::Feishu webhook 推送被拒绝（响应: ${resp}）"
            exit 0
          fi
          echo "::notice::Feishu 构建通知已送达"

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Smoke test one-command Windows installer
        # Use inbox Windows PowerShell 5.1; PowerShell 7 is backward-compatible
        # with the syntax exercised here.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.0.0-test.1'
          $asset = 'yoooclaw-win32-x64.exe'
          $serverRoot = Join-Path $env:RUNNER_TEMP 'yoooclaw-installer-server'
          $versionRoot = Join-Path $serverRoot "v$version"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'yoooclaw-local-app-data'
          $env:YOOOCLAW_HOME = Join-Path $env:RUNNER_TEMP 'yoooclaw-runtime-home'
          New-Item -ItemType Directory -Path $versionRoot -Force | Out-Null

          # Run the Windows-only syscall coverage on a real Windows runner.
          go test ./internal/cli -run '^(TestWindows|TestRemoveWindows|TestRemoveEmptyWindows)'
          go test ./internal/autostart ./internal/daemon -run '^TestWindows'
          if ($LASTEXITCODE -ne 0) { throw 'Windows daemon tests failed' }
          go test ./internal/autostart -run '^TestLegacyMigrationRepairGating$'
          if ($LASTEXITCODE -ne 0) { throw 'Migration permission tests failed' }
          go test ./scripts -run '^TestWindowsMigrationOptionalFields$'
          if ($LASTEXITCODE -ne 0) { throw 'Migration JSON tests failed' }

          # Simulate an older global npm installation and verify that the native
          # installer migrates it only after the new executable is usable.
          $mockNpmBin = Join-Path $env:RUNNER_TEMP 'mock-npm-bin'
          $env:MOCK_NPM_ROOT = Join-Path $env:RUNNER_TEMP 'mock-npm-root'
          $env:MOCK_NPM_LOG = Join-Path $env:RUNNER_TEMP 'mock-npm.log'
          New-Item -ItemType Directory -Path $mockNpmBin -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $env:MOCK_NPM_ROOT '@yoooclaw\cli') -Force | Out-Null
          '{}' | Set-Content -Encoding ascii (Join-Path $env:MOCK_NPM_ROOT '@yoooclaw\cli\package.json')
          $mockNpmSource = @'
          @echo off
          if "%1"=="root" (
            echo %MOCK_NPM_ROOT%
            exit /b 0
          )
          if "%1"=="uninstall" (
            echo %*>>"%MOCK_NPM_LOG%"
            exit /b 0
          )
          exit /b 2
          '@
          $mockNpmSource | Set-Content -Encoding ascii (Join-Path $mockNpmBin 'npm.cmd')
          $env:Path = "$mockNpmBin;$($env:Path)"

          go build -trimpath -ldflags "-s -w -X github.com/YoooClaw/cli/internal/version.Version=$version" -o (Join-Path $versionRoot $asset) ./cmd/yc
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $versionRoot $asset)).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii (Join-Path $versionRoot 'checksums.txt')
          $version | Set-Content -Encoding ascii (Join-Path $serverRoot 'latest')

          $baseUrl = 'http://127.0.0.1:18765'
          $installer = Get-Content -Raw scripts/install.ps1
          $installer = $installer.Replace('__YOOOCLAW_CLI_OSS_BASE_URL__', $baseUrl)
          $installer = $installer.Replace('__YOOOCLAW_CLI_TEMPLATE_RENDERED__', '1')
          # Windows PowerShell 5.1's `Set-Content -Encoding utf8` adds a BOM.
          # OSS publishes the repository bytes without one, so mirror that
          # behavior: a BOM at the start of text piped to Invoke-Expression is
          # interpreted as part of the first token.
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $serverRoot 'install.ps1'), $installer, $utf8NoBom)

          # Python does not know the .ps1 MIME type by default. Match the OSS
          # text/plain response so Invoke-RestMethod returns script text.
          $serverSource = @'
          import http.server
          import os
          import sys

          class Handler(http.server.SimpleHTTPRequestHandler):
              extensions_map = dict(http.server.SimpleHTTPRequestHandler.extensions_map, **{".ps1": "text/plain; charset=utf-8"})

              def guess_type(self, path):
                  if path.endswith("/latest") or path.endswith("/beta"):
                      return "text/plain; charset=utf-8"
                  return super().guess_type(path)

          os.chdir(sys.argv[1])
          http.server.ThreadingHTTPServer(("127.0.0.1", 18765), Handler).serve_forever()
          '@
          $serverScript = Join-Path $env:RUNNER_TEMP 'serve-yoooclaw-installer.py'
          $serverSource | Set-Content -Encoding utf8 $serverScript
          $server = Start-Process python -ArgumentList $serverScript, $serverRoot -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(15)
            do {
              try {
                Invoke-WebRequest -UseBasicParsing "$baseUrl/latest" | Out-Null
                $ready = $true
              }
              catch {
                Start-Sleep -Milliseconds 250
              }
            } until ($ready -or (Get-Date) -ge $deadline)
            if (-not $ready) { throw 'local installer server did not start' }

            Invoke-RestMethod "$baseUrl/install.ps1" | Invoke-Expression

            $installDir = Join-Path $env:LOCALAPPDATA 'YoooClaw\bin'
            $yoooclawVersion = & (Join-Path $installDir 'yoooclaw.exe') --version
            $ycVersion = & (Join-Path $installDir 'yc.exe') --version
            if ($yoooclawVersion -ne $version -or $ycVersion -ne $version) {
              throw "installed command versions do not match: yoooclaw=$yoooclawVersion yc=$ycVersion"
            }
            # No profile is initialized, so task migration is skipped. Do not
            # remove an old task's possible target without confirming migration.
            if (Test-Path -LiteralPath $env:MOCK_NPM_LOG) {
              throw 'old npm package was removed despite skipped task migration'
            }
            if (-not (Test-Path (Join-Path $env:MOCK_NPM_ROOT '@yoooclaw\cli\package.json'))) {
              throw 'old npm package was not preserved'
            }

            $persistedPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $installDirInPath = @($persistedPath -split ';' | Where-Object {
              -not [string]::IsNullOrWhiteSpace($_) -and
              [IO.Path]::GetFullPath($_.Trim()).TrimEnd('\') -ieq $installDir.TrimEnd('\')
            })
            if ($installDirInPath.Count -eq 0) {
              throw "native installer did not persist its directory in the user PATH"
            }

            # Windows native uninstall must not report ok until both command
            # paths have actually disappeared. This exercises deletion of the
            # currently running executable, not only an ordinary temp file.
            $uninstallOutput = & (Join-Path $installDir 'yoooclaw.exe') uninstall --yes --format json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or -not $uninstallOutput.ok -or -not $uninstallOutput.userPathRemoved) {
              throw "native uninstall did not report a verified success: $($uninstallOutput | ConvertTo-Json -Compress)"
            }
            foreach ($name in @('yoooclaw.exe', 'yc.exe')) {
              $path = Join-Path $installDir $name
              if (Test-Path -LiteralPath $path) {
                throw "native uninstall reported ok but path still exists: $path"
              }
            }
            $persistedPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $installDirInPath = @($persistedPath -split ';' | Where-Object {
              -not [string]::IsNullOrWhiteSpace($_) -and
              [IO.Path]::GetFullPath($_.Trim()).TrimEnd('\') -ieq $installDir.TrimEnd('\')
            })
            if ($installDirInPath.Count -ne 0) {
              throw "native uninstall left its directory in the persisted user PATH"
            }
            if (Test-Path -LiteralPath $installDir) {
              throw "native uninstall left an empty install directory: $installDir"
            }
            $installRoot = Split-Path -Parent $installDir
            if (Test-Path -LiteralPath $installRoot) {
              throw "native uninstall left an empty install root: $installRoot"
            }
          }
          finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

  # ── deploy-test：release/** 推送通过全部校验后，自动发布到测试环境 ─────────
  # 正式 / beta 发布只由当前 release 分支上的 cli-v* tag 触发（release-cli.yml）；
  # 合回 master 仅为代码归档，不发任何环境。
  #
  # 仓库公开、Actions 日志公开：测试桶名、域名、地域与 AK 全部放在 GitHub
  # Environment `test` 的 secrets 里（日志自动打码），workflow 里不写任何测试环境值。
  deploy-test:
    needs: [verify, windows-installer]
    # release.sh 的 bump 提交（"cli-<版本>"）只改版本号，紧随其后的 tag 会走生产
    # 发布，这里跳过，避免同一份代码再发一遍测试环境。
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/release/') &&
      !startsWith(github.event.head_commit.message, 'cli-')
    runs-on: ubuntu-latest
    environment: test
    # 测试桶只有一个 latest 标记：跨分支串行，避免旧构建后写覆盖新构建。
    concurrency:
      group: cli-test-deploy
      cancel-in-progress: false
    env:
      OSS_PREFIX: cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/oss-upload/go.sum

      # 测试版本号：<release 分支版本>-test.<run_number>（分支已是预发布版本时用
      # .test.<n> 续接）。run_number 单调递增，保证每次推送都是独立、可指定安装的版本，
      # 且按 SemVer 排在同名正式版之前。分支名不是合法版本号时回退到 package.json。
      - name: Resolve test version
        run: |
          BASE="${GITHUB_REF_NAME#release/}"
          if ! printf '%s\n' "$BASE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            BASE="$(node -p "require('./package.json').version")"
          fi
          case "$BASE" in
            *-*) VERSION="${BASE}.test.${GITHUB_RUN_NUMBER}" ;;
            *)   VERSION="${BASE}-test.${GITHUB_RUN_NUMBER}" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "::notice::测试版本 $VERSION"

      - name: Build native binaries
        run: |
          scripts/build-go.sh "$VERSION"
          cd dist-native
          sha256sum yoooclaw-* > checksums.txt
          cat checksums.txt

      - name: Smoke test Linux binary
        run: |
          VERSION_OUT="$(./dist-native/yoooclaw-linux-x64 --version)"
          if [ "$VERSION_OUT" != "$VERSION" ]; then
            echo "::error::linux native --version 输出 $VERSION_OUT，期望 $VERSION"
            exit 1
          fi

      - name: Upload to test OSS
        timeout-minutes: 40
        env:
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PUBLIC_URL: ${{ secrets.OSS_PUBLIC_URL }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          missing=()
          for key in OSS_REGION OSS_BUCKET OSS_PUBLIC_URL OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            [ -n "${!key}" ] || missing+=("$key")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::缺少 test environment secrets: ${missing[*]}"
            exit 1
          fi
          go -C tools/oss-upload run . --test-build --version "$VERSION"

      - name: Notify Feishu (测试环境已发布)
        if: success()
        env:
          HOOK: ${{ secrets.FEISHU_WEBHOOK_2 }}
          OSS_PUBLIC_URL: ${{ secrets.OSS_PUBLIC_URL }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::FEISHU_WEBHOOK_2 未配置，跳过测试发布通知"
            exit 0
          fi

          if [ -n "$BEFORE_SHA" ] &&
             ! printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$' &&
             git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE_SHA:0:12}..${GITHUB_SHA:0:12}"
            LOG_ARGS=("${BEFORE_SHA}..${GITHUB_SHA}")
          else
            RANGE="最近 20 条"
            LOG_ARGS=(-20 "$GITHUB_SHA")
          fi
          CHANGES=$(git log --no-merges --pretty=format:'%H' "${LOG_ARGS[@]}" | while read -r h; do
            subj=$(git log -1 --pretty=format:'%s' "$h")
            if grep -Eq '^(cli-)?[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$' <<< "$subj"; then
              continue
            fi
            printf '• %s\n' "$subj"
            git log -1 --pretty=format:'%b' "$h" \
              | grep -v -i -E '^(Co-Authored-By|Signed-off-by|Co-developed-by|Reviewed-by):' \
              | sed '/^[[:space:]]*$/d' \
              | sed 's/^/    /'
          done)
          [ -z "$CHANGES" ] && CHANGES="（无业务改动）"

          BASE_URL="${OSS_PUBLIC_URL%/}/${OSS_PREFIX}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="🧪 @yoooclaw/cli v${VERSION} 已发布到测试环境

          🌿 分支：${GITHUB_REF_NAME}
          🔖 Commit：${GITHUB_SHA:0:12}

          📥 macOS / Linux（最新测试构建）：
          curl -fsSL ${BASE_URL}/install.sh | sh -s -- --force

          📥 macOS / Linux（固定本次版本）：
          curl -fsSL ${BASE_URL}/install.sh | sh -s -- --version ${VERSION} --force

          📥 Windows PowerShell：
          & ([scriptblock]::Create((irm '${BASE_URL}/install.ps1'))) -Version ${VERSION} -Force

          📝 改动（${RANGE}）：
          ${CHANGES}

          🔎 ${RUN_URL}"
          PAYLOAD=$(jq -nc --arg t "$TEXT" '{msg_type:"text", content:{text:$t}}')

          if ! resp=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$HOOK"); then
            echo "::warning::Feishu webhook 推送失败（curl 请求错误）"
            exit 0
          fi
          code=$(printf '%s' "$resp" | jq -r '.code // .StatusCode // empty')
          if [ "$code" != "0" ]; then
            echo "::warning::Feishu webhook 推送被拒绝（响应: ${resp}）"
            exit 0
          fi
          echo "::notice::Feishu 测试发布通知已送达"
