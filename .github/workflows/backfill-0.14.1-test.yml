name: Backfill 0.14.1 test draft
on:
  push:
    branches: [release/0.14.1]
    paths: [.github/workflows/backfill-0.14.1-test.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: cli-test-deploy
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: test
    env:
      VERSION: 0.14.1
      OSS_PREFIX: cli
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 591a49f304f1a9de7d2856faf38d972f18e0e08b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/oss-upload/go.sum
      - name: Verify signed build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/YoooClaw/cli/actions/runs/40467421593 --jq '.head_sha' | grep -Fx 591a49f304f1a9de7d2856faf38d972f18e0e08b
          gh api repos/YoooClaw/cli/actions/runs/40467421593/attempts/2/jobs --jq '.jobs[] | select(.name == "build-release") | .conclusion' | grep -Fx success
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12730601119'
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: YoooClaw/cli
          run-id: 40467421593
          path: dist-native
      - name: Verify against published production checksums
        run: |
          set -euo pipefail
          curl -fsSL https://artifact.yoooclaw.com/cli/v0.14.1/checksums.txt -o dist-native/checksums.txt
          cd dist-native
          sha256sum --check checksums.txt
      - name: Preserve current test latest marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/oss-upload/main.go')
          s = p.read_text()
          old = 'live := !prerelease || *testBuild'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'live := false // Backfill versioned artifacts only.'))
          PY
      - name: Upload versioned test artifacts
        timeout-minutes: 40
        env:
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PUBLIC_URL: ${{ secrets.OSS_PUBLIC_URL }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          for key in OSS_REGION OSS_BUCKET OSS_PUBLIC_URL OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            [ -n "${!key}" ] || { echo "Missing test secret: $key"; exit 1; }
          done
          go -C tools/oss-upload run . --version "$VERSION"
      - name: Register test OTA draft once
        timeout-minutes: 4
        env:
          OTA_DRAFT_URL: https://openclaw-service-test.yoooclaw.com/api/ota/pipeline/plugin/releases
          OTA_PLUGIN_RELEASE_PIPELINE_TOKEN: ${{ secrets.OTA_PLUGIN_RELEASE_PIPELINE_TOKEN }}
          OTA_ARTIFACT_BASE_URL: ${{ secrets.OSS_PUBLIC_URL }}/cli
        run: node scripts/register-ota-draft.mjs
