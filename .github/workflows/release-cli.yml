name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is on release branch
        run: |
          git fetch --no-tags origin '+refs/heads/release/*:refs/remotes/origin/release/*'
          CONTAINING_RELEASE_BRANCHES="$(git branch -r --contains "$GITHUB_SHA" --list 'origin/release/*')"
          if [ -z "$CONTAINING_RELEASE_BRANCHES" ]; then
            echo "::error::Release tag must point to a commit on origin/release/**"
            exit 1
          fi
          echo "::notice::Release source branch(es):"
          echo "$CONTAINING_RELEASE_BRANCHES"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify tag version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION 与 package.json $PKG_VERSION 不一致"
            exit 1
          fi

      - name: Verify OTA draft registration
        run: node --test scripts/register-ota-draft.test.mjs

      - name: Verify Go source
        run: |
          go test ./...
          go vet ./...

  build-release:
    needs: preflight
    runs-on: macos-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION 与 package.json $VERSION 不一致"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate Apple signing secrets
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          missing=()
          for key in \
            APPLE_DEVELOPER_ID_CERT_P12_BASE64 \
            APPLE_DEVELOPER_ID_CERT_PASSWORD \
            APPLE_NOTARY_APPLE_ID \
            APPLE_NOTARY_TEAM_ID \
            APPLE_NOTARY_PASSWORD
          do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::缺少 Apple 签名或公证 GitHub Secrets: ${missing[*]}"
            exit 1
          fi

      - name: Build Go binaries
        run: scripts/build-go.sh "$VERSION"

      - name: Smoke test current macOS binary
        run: |
          case "$(uname -m)" in
            arm64) bin="dist-native/yoooclaw-darwin-arm64" ;;
            x86_64) bin="dist-native/yoooclaw-darwin-x64" ;;
            *)
              echo "::error::Unsupported macOS runner arch: $(uname -m)"
              exit 1
              ;;
          esac
          VERSION_OUT="$("$bin" --version)"
          if [ "$VERSION_OUT" != "$VERSION" ]; then
            echo "::error::$bin --version 输出 $VERSION_OUT，期望 $VERSION"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/yoooclaw-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"

          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::P12 中未找到 Developer ID Application 签名身份"
            exit 1
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Sign Darwin binaries
        run: |
          for file in \
            dist-native/yoooclaw-darwin-arm64 \
            dist-native/yoooclaw-darwin-x64
          do
            codesign \
              --force \
              --options runtime \
              --timestamp \
              --keychain "$SIGNING_KEYCHAIN_PATH" \
              --sign "$SIGNING_IDENTITY" \
              "$file"
            codesign --verify --strict --verbose=2 "$file"
            signature="$(codesign -dv --verbose=4 "$file" 2>&1)"
            printf '%s\n' "$signature"
            if ! printf '%s\n' "$signature" | grep -qx 'TeamIdentifier=7LMW5J8VKX'; then
              echo "::error::Unexpected Apple signing team"
              exit 1
            fi
          done

      - name: Notarize Darwin binaries
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          NOTARY_PROFILE="yoooclaw-notarytool"
          NOTARY_STAGE="$RUNNER_TEMP/yoooclaw-notary"
          ZIP_PATH="$RUNNER_TEMP/yoooclaw-darwin.zip"
          RESULT_PATH="$RUNNER_TEMP/yoooclaw-notary-result.json"
          LOG_PATH="$RUNNER_TEMP/yoooclaw-notary-log.json"

          mkdir -p "$NOTARY_STAGE"
          cp dist-native/yoooclaw-darwin-* "$NOTARY_STAGE/"
          ditto -c -k --keepParent "$NOTARY_STAGE" "$ZIP_PATH"

          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --keychain "$SIGNING_KEYCHAIN_PATH" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --team-id "$APPLE_NOTARY_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD"

          set +e
          xcrun notarytool submit "$ZIP_PATH" \
            --keychain-profile "$NOTARY_PROFILE" \
            --keychain "$SIGNING_KEYCHAIN_PATH" \
            --wait \
            --output-format json > "$RESULT_PATH"
          submit_code=$?
          set -e

          cat "$RESULT_PATH"
          submission_id="$(jq -r '.id // empty' "$RESULT_PATH")"
          status="$(jq -r '.status // empty' "$RESULT_PATH")"
          if [ -n "$submission_id" ]; then
            xcrun notarytool log "$submission_id" \
              --keychain-profile "$NOTARY_PROFILE" \
              --keychain "$SIGNING_KEYCHAIN_PATH" \
              "$LOG_PATH" || true
            [ ! -s "$LOG_PATH" ] || cat "$LOG_PATH"
          fi
          if [ "$submit_code" -ne 0 ] || [ "$status" != "Accepted" ]; then
            echo "::error::Apple 公证失败，status=${status:-unknown}"
            exit 1
          fi

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: cli-native
          path: dist-native/
          if-no-files-found: error
          compression-level: 0

      - name: Delete temporary signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ] && [ -e "$SIGNING_KEYCHAIN_PATH" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH"
          fi

  # Promote the signed build unchanged; register a draft without starting rollout.
  deploy-test:
    needs: build-release
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: cli-test-deploy
      cancel-in-progress: false
    env:
      OSS_PREFIX: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/oss-upload/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: cli-native
          path: dist-native
      - name: Resolve version and checksums
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          cd dist-native
          sha256sum yoooclaw-* > checksums.txt
      - name: Upload release artifacts to test OSS
        timeout-minutes: 40
        env:
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PUBLIC_URL: ${{ secrets.OSS_PUBLIC_URL }}
          OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          missing=()
          for key in OSS_REGION OSS_BUCKET OSS_PUBLIC_URL OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            [ -n "${!key}" ] || missing+=("$key")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::缺少 test environment secrets: ${missing[*]}"
            exit 1
          fi
          go -C tools/oss-upload run . --test-build --version "$VERSION"
      - name: Register test OTA draft
        timeout-minutes: 4
        env:
          OTA_DRAFT_URL: https://openclaw-service-test.yoooclaw.com/api/ota/pipeline/plugin/releases
          OTA_PLUGIN_RELEASE_PIPELINE_TOKEN: ${{ secrets.OTA_PLUGIN_RELEASE_PIPELINE_TOKEN }}
          OTA_ARTIFACT_BASE_URL: ${{ secrets.OSS_PUBLIC_URL }}/cli
        run: node scripts/register-ota-draft.mjs

  release:
    needs: [build-release, deploy-test]
    runs-on: ubuntu-latest
    environment: production
    env:
      OSS_REGION: oss-cn-hangzhou
      OSS_BUCKET: yoooclaw-artifacts
      OSS_PUBLIC_URL: https://artifact.yoooclaw.com
      OSS_PREFIX: cli
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/oss-upload/go.sum

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          name: cli-native
          path: dist-native

      - name: Resolve version and channel
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION 与 package.json $VERSION 不一致"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=1" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=0" >> "$GITHUB_ENV"
          fi

      - name: Smoke test Linux binary
        run: |
          chmod +x dist-native/yoooclaw-*
          VERSION_OUT="$(./dist-native/yoooclaw-linux-x64 --version)"
          if [ "$VERSION_OUT" != "$VERSION" ]; then
            echo "::error::linux native --version 输出 $VERSION_OUT，期望 $VERSION"
            exit 1
          fi

      - name: Compute checksums
        run: |
          cd dist-native
          sha256sum yoooclaw-* > checksums.txt
          expected=5
          actual="$(wc -l < checksums.txt | tr -d ' ')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checksums.txt 应包含 $expected 个 native 产物，实际为 $actual"
            exit 1
          fi
          cat checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist-native/yoooclaw-darwin-arm64 \
            dist-native/yoooclaw-darwin-x64 \
            dist-native/yoooclaw-linux-arm64 \
            dist-native/yoooclaw-linux-x64 \
            dist-native/yoooclaw-win32-x64.exe \
            dist-native/checksums.txt
          )

          if gh release view "cli-v$VERSION" >/dev/null 2>&1; then
            gh release upload "cli-v$VERSION" "${assets[@]}" --clobber
          else
            args=(--generate-notes)
            if [ "$PRERELEASE" = "1" ]; then
              args+=(--prerelease)
            fi
            gh release create "cli-v$VERSION" "${assets[@]}" "${args[@]}"
          fi

      - name: Upload artifacts to Alibaba OSS
        timeout-minutes: 40
        env:
          OSS_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ -z "$OSS_ACCESS_KEY_ID" ] || [ -z "$OSS_ACCESS_KEY_SECRET" ]; then
            echo "::error::缺少 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET GitHub Secrets（production environment）"
            exit 1
          fi
          go -C tools/oss-upload run . --version "$VERSION"

      - name: Register production OTA draft
        timeout-minutes: 4
        env:
          OTA_DRAFT_URL: https://openclaw-service.yoooclaw.com/api/ota/pipeline/plugin/releases
          OTA_PLUGIN_RELEASE_PIPELINE_TOKEN: ${{ secrets.OTA_PLUGIN_RELEASE_PIPELINE_TOKEN }}
          OTA_ARTIFACT_BASE_URL: ${{ env.OSS_PUBLIC_URL }}/${{ env.OSS_PREFIX }}
        run: node scripts/register-ota-draft.mjs

      - name: Notify Feishu
        if: success()
        env:
          HOOK_2: ${{ secrets.FEISHU_WEBHOOK_2 }}
        run: |
          CURRENT_TAG="cli-v${VERSION}"
          PREV_TAG=$(git tag --list 'cli-v*' --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
            LOG_ARGS=("$RANGE")
          else
            RANGE="最近 20 条"
            LOG_ARGS=(-20 "$CURRENT_TAG")
          fi

          CHANGES=$(git log --no-merges --pretty=format:'%H' "${LOG_ARGS[@]}" | while read -r h; do
            subj=$(git log -1 --pretty=format:'%s' "$h")
            if grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$' <<< "$subj"; then
              continue
            fi
            printf '• %s\n' "$subj"
            git log -1 --pretty=format:'%b' "$h" \
              | grep -v -i -E '^(Co-Authored-By|Signed-off-by|Co-developed-by|Reviewed-by):' \
              | sed '/^[[:space:]]*$/d' \
              | sed 's/^/    /'
          done)
          [ -z "$CHANGES" ] && CHANGES="（无业务改动）"

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${CURRENT_TAG}"
          CHANNEL="稳定版"
          [ "$PRERELEASE" = "1" ] && CHANNEL="预发布"

          # 预发布版只能按版本号装：live 安装脚本与 latest 标记不会被 beta 覆盖。
          INSTALL_FLAGS=""
          [ "$PRERELEASE" = "1" ] && INSTALL_FLAGS=" -s -- --version ${VERSION}"

          WINDOWS_INSTALL_COMMAND="irm ${OSS_PUBLIC_URL}/${OSS_PREFIX}/install.ps1 | iex"
          if [ "$PRERELEASE" = "1" ]; then
            WINDOWS_INSTALL_COMMAND="& ([scriptblock]::Create((irm '${OSS_PUBLIC_URL}/${OSS_PREFIX}/install.ps1'))) -Version ${VERSION}"
          fi

          TEXT="🚀 @yoooclaw/cli ${CURRENT_TAG}（${CHANNEL}）已发布

          📥 macOS / Linux 安装（阿里云 OSS）：
          curl -fsSL ${OSS_PUBLIC_URL}/${OSS_PREFIX}/install.sh | sh${INSTALL_FLAGS}

          📥 Windows PowerShell 安装（无需 Node/npm）：
          ${WINDOWS_INSTALL_COMMAND}

          📝 改动（${RANGE}）：
          ${CHANGES}

          🔗 ${URL}"

          PAYLOAD=$(jq -nc --arg t "$TEXT" '{msg_type:"text", content:{text:$t}}')

          for hook in "$HOOK_2"; do
            [ -z "$hook" ] && continue
            if ! curl -fsS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$hook"; then
              echo "::warning::Feishu webhook 推送失败"
            fi
            echo
          done
