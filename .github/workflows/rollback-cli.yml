name: Rollback CLI OSS

# Retained as an explicit error for callers of the old rollback entry.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 回滚到的正式版本号（如 0.12.2）
        required: true

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Require platform rollback
        run: |
          echo "::error::生产 OSS latest 已改由灰度平台维护。请通过平台回退指针；不要重传历史制品。"
          exit 1
